# Stricter than the Flutter default, matching the TypeScript config on the web
# side: noUncheckedIndexedAccess, noUnusedLocals and friends caught real bugs
# there, and the equivalents are worth having here.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # An unawaited Future in a booking flow is a ride that silently never got
    # requested. Error, not a hint.
    unawaited_futures: error
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - require_trailing_commas
    - unawaited_futures
    - use_super_parameters
